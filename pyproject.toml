[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "labdefender"
version = "0.1.0"
description = "Telegram-бот для сдачи и защиты лабораторных работ"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "SQLAlchemy[asyncio]>=2.0.40,<2.1",
    "aiosqlite>=0.21,<1",
    "pydantic-settings>=2.9,<3",
    "tzdata>=2025.2",
    "filelock>=3.18,<4",
    # Certificates for the Mini App address check; aiogram depends on it as well.
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
labdefender = "labdefender.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labdefender = ["web/static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
